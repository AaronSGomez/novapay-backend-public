version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"   # Elimínalo si no necesitas acceso desde fuera del compose
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: