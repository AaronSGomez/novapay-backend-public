version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: novapay_postgres
    restart: always
    env_file:
      - .env.server
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novapay_net

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: novapay_backend
    restart: always
    env_file:
      - .env.server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MIN: ${JWT_EXPIRATION_MIN}

      CERT_SIGNING_ENABLED: ${CERT_SIGNING_ENABLED}
      CERT_ALIAS: ${CERT_ALIAS}
      CERT_PASSWORD: ${CERT_PASSWORD}
      CERT_P12_BASE64: ${CERT_P12_BASE64}

      VERIFACTU_ENDPOINT_URL: ${VERIFACTU_ENDPOINT_URL}
      VERIFACTU_SOAP_ACTION: ${VERIFACTU_SOAP_ACTION}
      VERIFACTU_TIMEOUT: ${VERIFACTU_TIMEOUT}
      VERIFACTU_MAX_RETRIES: ${VERIFACTU_MAX_RETRIES}
      VERIFACTU_PRODUCTION: ${VERIFACTU_PRODUCTION}

      # Optional: if first chain seed is needed when no previous local accepted hash exists
      FISCAL_CHAIN_SEED_HASH: ${FISCAL_CHAIN_SEED_HASH}
    depends_on:
      - postgres
    networks:
      - novapay_net

  nginx:
    image: nginx:alpine
    container_name: novapay_nginx
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - novapay_net

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: novapay_crowdsec
    restart: always
    environment:
      COLLECTIONS: crowdsecurity/nginx crowdsecurity/http-cve
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - novapay_net

networks:
  novapay_net:
    driver: bridge

volumes:
  postgres_data:
  crowdsec-db:
  crowdsec-config:
